<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — SurfAgencyMorocco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo"><span data-i18n="nav.surf">Surf</span><span data-i18n="nav.agency">Agency</span><span data-i18n="nav.morocco">Morocco</span></div>
    <p class="login-subtitle" data-i18n="login.adminSubtitle">Admin Panel</p>
    <form id="loginForm">
      <div class="login-field">
        <label for="email" data-i18n="login.email">Email</label>
        <input type="email" id="email" placeholder="admin@surfagencymorocco.com" required>
      </div>
      <div class="login-field">
        <label for="password" data-i18n="login.password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <div class="login-error" id="loginError"></div>
      <button type="submit" id="loginBtn" class="login-btn" data-i18n="login.signIn">Sign In</button>
    </form>
  </div>
</div>

<script defer src="../assets/js/i18n.js"></script>
<script defer src="../assets/js/supabase-client.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var form = document.getElementById('loginForm');
  var email = document.getElementById('email');
  var password = document.getElementById('password');
  var error = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    error.textContent = '';
    btn.disabled = true;
    btn.textContent = (window.i18n && window.i18n.t('login.signingIn')) || 'Signing in...';

    var attempts = 0;
    var MAX_ATTEMPTS = 50;

    function doLogin() {
      attempts++;
      console.log('[Login] Waiting for Supabase SDK... attempt ' + attempts + '/' + MAX_ATTEMPTS);

      if (window._supabaseLoadError) {
        console.error('[Login] Supabase SDK load error: ' + window._supabaseLoadError);
        error.textContent = window._supabaseLoadError;
        btn.disabled = false;
        btn.textContent = (window.i18n && window.i18n.t('login.signIn')) || 'Sign In';
        return;
      }

      if (!window._supabase) {
        if (attempts >= MAX_ATTEMPTS) {
          console.error('[Login] Timeout: Supabase SDK did not load after ' + MAX_ATTEMPTS + ' attempts (~10s)');
          error.textContent = 'Connection error. Please check your internet and try refreshing the page.';
          btn.disabled = false;
          btn.textContent = (window.i18n && window.i18n.t('login.signIn')) || 'Sign In';
          return;
        }
        setTimeout(doLogin, 200);
        return;
      }

      console.log('[Login] Supabase SDK ready. Attempting sign-in for: ' + email.value.replace(/(.{2}).+(@.+)/, '$1***$2'));
      SupabaseAPI.login(email.value, password.value).then(function(result) {
        if (result.error) {
          console.error('[Login] Sign-in failed: ' + result.error.message);
          error.textContent = result.error.message;
          btn.disabled = false;
          btn.textContent = (window.i18n && window.i18n.t('login.signIn')) || 'Sign In';
        } else {
          console.log('[Login] Sign-in successful. Redirecting to dashboard...');
          window.location.href = 'dashboard.html';
        }
      }).catch(function(err) {
        console.error('[Login] Unexpected error: ' + (err && err.message ? err.message : err));
        error.textContent = 'An unexpected error occurred. Please try again.';
        btn.disabled = false;
        btn.textContent = (window.i18n && window.i18n.t('login.signIn')) || 'Sign In';
      });
    }
    doLogin();
  });
});
</script>
</body>
</html>
